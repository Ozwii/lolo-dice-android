name: Compilar APK de Lolo Dice

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle y caché
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: Subir APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: LoloDice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
